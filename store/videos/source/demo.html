<!doctype html>
<!--
  The demo: one promise, shown on the app's real screens. 30 s, 1920×1080, then the landscape logo sting (Hebrew).
  No voice: the headlines carry it, since most people watch it muted.
  The promise: every project on one screen, what Claude did, what waits for you, and what isn't saved.
  First the problem as a developer lives it: four Claude Code windows, one of them asking for permission behind the
  others. Then YDeck's Now page answers it, row by row, a soft ring opening on the dot each headline is about.
  window.render(t) draws the frame at t seconds; render.cjs films it (`node render.cjs demo`).
  The screens are the app itself, drawn by desktop/src/test/.../RenderFilm.kt (`gradlew :desktop:test -Prender --tests "*RenderFilm"`)
  at 3× into desktop/build/film-renders/; the camera moves over them, one headline at a time, the full stop the amber dot.
    0.3  "ארבעה פרויקטים. ארבעה חלונות של Claude Code."   the terminals arrive, one over another, all busy
    3.4  "באיזה מהם Claude מחכה לך?"                       Orbit's asks for permission, half hidden under Pulse's
    6.6  "YDeck: כל הפרויקטים במסך אחד."                   the terminals go; Now opens
    8.9  "Claude מחכה לך ב־Orbit, והנה למה."              Orbit: the permission it waits for
   11.6  "מה הוא עשה, ומה עוד לא נשמר."                    last time, the session's files not committed, commits not pushed
   14.5  "שרת שנשאר דולק, מפתח שחסר ב־env."               Nova: its dev server, the key missing in .env
   17.3  "לחיצה, ורואים מה בדיוק השתנה."                    Review: the session's receipt and its diff
   21.2  "ובסוף היום, סוגרים הכול בלחיצה."                  Close the day; nothing is open, the green dot
   25.7  the end card: "כל הפרויקטים. מסך אחד." and what YDeck is, in one line
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Plex; src: url("../../../app/src/main/res/font/plex_sans_hebrew_medium.ttf"); font-weight: 500; }
  @font-face { font-family: Plex; src: url("../../../app/src/main/res/font/plex_sans_hebrew_regular.ttf"); font-weight: 400; }
  html, body { margin: 0; background: #0B0B0D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const g = document.getElementById('c').getContext('2d');
const NIGHT = [11, 11, 13], PAPER = [244, 244, 245], MUTED = [139, 139, 147], AMBER = [245, 165, 36], CLAUDE = [217, 119, 87];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out3 = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, k) => a + (b - a) * k;
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const DURATION = window.DURATION = 30.0;
const MONO = 'Consolas, "Cascadia Mono", monospace';

// YDeck's states of a Claude session (the app's colours, Look.kt)
const STATE = { work: [156, 151, 255], wait: AMBER, clean: [52, 199, 123], note: PAPER };
// a landing: a ring that opens from a dot and fades
function halo(x, y, r, c, k, a = 1) {
  if (k <= 0 || k >= 1) return;
  g.save(); g.globalAlpha = a * (1 - k) * .7; g.strokeStyle = rgb(c); g.lineWidth = r * .22;
  g.beginPath(); g.arc(x, y, r * (1 + 2.2 * out3(k)), 0, Math.PI * 2); g.stroke(); g.restore();
}

// ---------- 1 · the problem: four Claude Code windows ----------
// [project, x, y, arrives, lines]: a line is [text, colour, from (s after arriving)]; '✻' lines spin while they work
const TERMS = [
  ['Ledger', 170, 330, 0.3, [['> fix the CSV export for refunds', PAPER, .2], ['● Read(src/export/csv.ts)', MUTED, .7], ['● Bash(npm test -- export)', MUTED, 1.2], ['✻ Working… (48s)', CLAUDE, 1.6]]],
  ['Orbit', 610, 420, 0.9, [['> add the Stripe webhook for deposits, with tests', PAPER, .2], ['● Write(src/webhook.ts)', MUTED, .6], ['● Write(src/webhook.test.ts)', MUTED, .9],
    ['Bash command: npm test', PAPER, 1.4], ['Do you want to proceed?', AMBER, 1.6], ['❯ 1. Yes   2. No', AMBER, 1.7]]],
  ['Nova', 1000, 290, 1.5, [['> move the sign-in screen to the new design system', PAPER, .2], ['● Edit(app/signin.tsx)', MUTED, .6], ['● Read(app/theme.ts)', MUTED, .9], ['✻ Working… (2m 14s)', CLAUDE, 1.2]]],
  ['Pulse', 900, 585, 2.1, [['> add a streak counter to the home screen', PAPER, .2], ['● Edit(app/Home.kt)', MUTED, .5], ['● Added the streak counter.', PAPER, 1.0], ['>', MUTED, 1.3]]],
];
const TW = 760, TH = 400, BAR = 46;
const TERMS_OUT = [6.4, 7.3];
function terminals(t) {
  if (t > TERMS_OUT[1]) return;
  const out = ease(seg(t, ...TERMS_OUT));
  TERMS.forEach(([name, x0, y0, at, lines], i) => {
    const inn = out3(seg(t, at, at + .45));
    if (inn <= 0) return;
    // a slow drift, each its own way; on the way out they scatter and fall back
    const dx = 6 * Math.sin(t * .7 + i * 2) + (i % 2 ? 1 : -1) * 90 * out, dy = 4 * Math.cos(t * .6 + i) + (1 - inn) * 30 + 40 * out;
    const sc = (.94 + .06 * inn) * (1 - .1 * out);
    g.save(); g.globalAlpha = inn * (1 - out);
    g.translate(x0 + TW / 2 + dx, y0 + TH / 2 + dy); g.scale(sc, sc); g.translate(-TW / 2, -TH / 2);
    g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 60; g.shadowOffsetY = 18;
    g.fillStyle = '#0F0F12'; g.beginPath(); g.roundRect(0, 0, TW, TH, 14); g.fill();
    g.shadowColor = 'transparent';
    g.save(); g.beginPath(); g.roundRect(0, 0, TW, TH, 14); g.clip();
    g.fillStyle = '#1C1C21'; g.fillRect(0, 0, TW, BAR);
    [[255, 95, 87], [254, 188, 46], [40, 200, 64]].forEach((c, k) => { g.fillStyle = rgb(c, .85); g.beginPath(); g.arc(24 + k * 22, BAR / 2, 6.5, 0, Math.PI * 2); g.fill(); });
    g.font = `500 21px ${MONO}`; g.fillStyle = rgb(MUTED); g.textAlign = 'center'; g.direction = 'ltr'; g.textBaseline = 'middle';
    g.fillText(`${name} — claude`, TW / 2, BAR / 2 + 1);
    g.textAlign = 'left'; g.font = `400 23px ${MONO}`;
    lines.forEach(([s, c, from], k) => {
      const shown = seg(t, at + from, at + from + .35);
      if (shown <= 0) return;
      let text = s.slice(0, Math.ceil(s.length * shown));
      if (text.startsWith('✻')) text = '✻✶✳✢'[Math.floor(t * 6 + i) % 4] + text.slice(1);
      // the question blinks, softly, for no one to see
      const blink = c === AMBER ? .65 + .35 * Math.sin(t * 5) : 1;
      g.fillStyle = rgb(c, blink); g.fillText(text, 28, BAR + 42 + k * 46);
    });
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.1)'; g.lineWidth = 1.5; g.beginPath(); g.roundRect(0, 0, TW, TH, 14); g.stroke();
    g.restore();
  });
}

// ---------- 2 · the screens ----------
const SRC = '../../../desktop/build/film-renders/';
const IMG = {};
const SCREENS = ['loops', 'orbit-session', 'closeday', 'loops-clear'];
const load = (key, file) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[key] = i; r(); }; i.onerror = () => r(); i.src = SRC + file; });

// The window: the screens are 3600×2340 (1200×780 at 3×). The camera puts image point (x, y) at FOCUS, at s screen px per image px.
const IW = 3600, IH = 2340, BASE = { x: 1800, y: 1170, s: 0.345 }, FOCUS = [960, 640];
const SHOTS = [ // [from, to, camera]: the camera eases from the previous shot to this one over [from, to]
  [6.8, 6.8, BASE],
  [8.8, 9.7, { x: 1520, y: 560, s: 0.62 }],               // Orbit: Claude waits for you
  [11.5, 12.3, { x: 1520, y: 930, s: 0.62 }],             // what it did, what isn't saved
  [14.4, 15.2, { x: 1520, y: 1700, s: 0.6 }],             // Nova: the server, the .env key
  [17.2, 17.9, { x: 1300, y: 900, s: 0.5 }],              // back to Orbit's Review
  [18.6, 18.6, BASE],                                     // the Git tab, whole
  [18.9, 19.6, { x: 1150, y: 1080, s: 0.66 }],            // the session's receipt
  [19.8, 20.8, { x: 900, y: 1500, s: 0.76 }],             // down its diff
  [21.0, 21.6, BASE],                                     // Now again
  [23.0, 23.8, { x: 1800, y: 1250, s: 0.4 }],             // the day's plan
  [24.3, 25.2, { x: 1494, y: 760, s: 0.6 }],              // nothing is open
];
function camera(t) {
  let c = SHOTS[0][2];
  for (const [a, b, to] of SHOTS) {
    if (t < a) break;
    const k = b > a ? ease(seg(t, a, b)) : 1;
    c = { x: lerp(c.x, to.x, k), y: lerp(c.y, to.y, k), s: lerp(c.s, to.s, k) };
  }
  // a slow drift, so no shot is ever quite still
  return { ...c, s: c.s * (1 + .012 * Math.sin(t * .5)) };
}
const LAYERS = [ // [screen, in, out]: crossfades
  ['loops', 6.8, 18.75], ['orbit-session', 18.4, 21.4], ['loops', 21.0, 23.0], ['closeday', 22.8, 24.4], ['loops-clear', 24.2, 99],
];
const WINDOW_IN = [6.7, 7.7], WINDOW_OUT = [25.4, 26.0];
// Where the window puts image point (x, y) on the screen at t, and how many screen px an image px is.
function view(t) {
  const c = camera(t), sx = lerp(.86, 1, ease(seg(t, ...WINDOW_IN)));
  return { c, sx, k: sx * c.s };
}
const toScreen = (v, x, y) => [FOCUS[0] + v.k * (x - v.c.x), FOCUS[1] + v.k * (y - v.c.y)];

function windowLayer(t) {
  if (t < WINDOW_IN[0] || t > WINDOW_OUT[1]) return;
  const v = view(t), c = v.c;
  const fade = out3(seg(t, ...WINDOW_IN)) * (1 - seg(t, ...WINDOW_OUT));
  g.save();
  g.translate(FOCUS[0], FOCUS[1]); g.scale(v.sx, v.sx); g.translate(-FOCUS[0], -FOCUS[1]);
  g.translate(FOCUS[0] - c.x * c.s, FOCUS[1] - c.y * c.s); g.scale(c.s, c.s);
  // the window: a soft shadow, rounded, a hairline
  const r = 22 / c.s;
  g.globalAlpha = fade;
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 80 / c.s; g.shadowOffsetY = 24 / c.s;
  g.fillStyle = '#0B0B0D'; g.beginPath(); g.roundRect(0, 0, IW, IH, r); g.fill();
  g.shadowColor = 'transparent';
  g.save(); g.beginPath(); g.roundRect(0, 0, IW, IH, r); g.clip();
  for (const [key, a, b] of LAYERS) {
    const al = seg(t, a, a + .45) * (1 - seg(t, b - .45, b));
    if (al <= 0 || !IMG[key]) continue;
    g.globalAlpha = fade * al;
    g.drawImage(IMG[key], 0, 0, IW, Math.min(IH, IMG[key].height), 0, 0, IW, Math.min(IH, IMG[key].height));
  }
  g.restore();
  g.globalAlpha = fade * .9; g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2 / c.s;
  g.beginPath(); g.roundRect(0, 0, IW, IH, r); g.stroke();
  g.globalAlpha = 1;
  for (const [at, x, y, st] of RINGS) halo(x, y, 24, STATE[st], seg(t, at, at + .8), fade);
  cursor(t);
  g.restore();
  g.globalAlpha = 1;
}

// ---------- the rings: on the dot each headline is about, in image px of the Now page ----------
const RINGS = [
  [9.6, 2659, 607, 'wait'],                                              // Claude needs your permission
  [12.2, 2650, 758, 'note'], [12.6, 2659, 932, 'wait'], [13.0, 2659, 1134, 'wait'], // last time; not committed; not pushed
  [15.2, 2659, 1913, 'work'], [15.6, 2659, 2111, 'wait'],               // Nova's server; the .env key
  [24.9, 1494, 509, 'clean'],                                            // nothing is open
];

// ---------- the pointer, in image px ----------
// [moves from, presses at, x, y]: it glides to the button, presses, and fades
const CLICKS = [[17.6, 18.3, 419, 936], [21.8, 22.6, 451, 191]];
function cursor(t) {
  for (const [from, at, bx, by] of CLICKS) {
    const a = seg(t, from, from + .3) * (1 - seg(t, at + .5, at + .8));
    if (a <= 0) continue;
    const k = ease(seg(t, from, at - .1));
    const x = lerp(bx + 900, bx + 30, k), y = lerp(by + 700, by + 20, k);
    const press = 1 - .14 * Math.sin(Math.PI * seg(t, at - .05, at + .2));
    // the click: a ring that opens from the button
    const ring = seg(t, at, at + .6);
    if (ring > 0 && ring < 1) {
      g.globalAlpha = (1 - ring) * .5; g.strokeStyle = rgb(PAPER); g.lineWidth = 6;
      g.beginPath(); g.ellipse(bx, by, 200 + 160 * out3(ring), 80 + 110 * out3(ring), 0, 0, Math.PI * 2); g.stroke();
    }
    g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(4.6 * press, 4.6 * press);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 17); g.lineTo(4.2, 13.2); g.lineTo(7, 19.5); g.lineTo(9.6, 18.4); g.lineTo(6.9, 12.3); g.lineTo(12.4, 12.3); g.closePath();
    g.fillStyle = '#fff'; g.strokeStyle = '#111'; g.lineWidth = 1.1; g.lineJoin = 'round'; g.fill(); g.stroke();
    g.restore();
  }
}

// ---------- 3 · the end card: the promise, and what YDeck is ----------
function endCard(t) {
  if (t < WINDOW_OUT[0]) return;
  const end = 1 - seg(t, DURATION - .5, DURATION);
  // the green dot of "nothing open" leaves the window and settles over the promise
  const v = view(WINDOW_OUT[0]), [sx, sy] = toScreen(v, 1494, 509), k = ease(seg(t, WINDOW_OUT[0], WINDOW_OUT[0] + .9));
  const x = lerp(sx, W / 2, k), y = lerp(sy, 330, k) - 50 * Math.sin(Math.PI * k), r = lerp(13 * v.k, 22, k);
  g.globalAlpha = end; g.fillStyle = rgb(STATE.clean); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  halo(W / 2, 330, 22, STATE.clean, seg(t, WINDOW_OUT[0] + .9, WINDOW_OUT[0] + 1.7), end);
  const lines = [[26.2, 'כל הפרויקטים. מסך אחד.', '500 92px Plex', PAPER, 500], [26.8, 'מה Claude עשה, מה מחכה לך, ומה לא נשמר', '400 40px Plex', MUTED, 590],
    [27.4, 'YDeck · חינם וקוד פתוח · ל־Claude Code ב־Windows', '400 32px Plex', MUTED, 700], [27.7, 'ydeck-app.pages.dev', `400 32px ${MONO}`, PAPER, 760]];
  for (const [at, s, font, c, ly] of lines) {
    const inn = out3(seg(t, at, at + .6));
    if (inn <= 0) continue;
    g.globalAlpha = inn * end; g.font = font; g.fillStyle = rgb(c); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.direction = font.includes('Plex') ? 'rtl' : 'ltr';
    g.fillText(s, W / 2, ly + (1 - inn) * 16);
  }
  g.globalAlpha = 1;
}

// ---------- the headlines (the last mark in amber: the dot, or the question) ----------
const HEADS = [[0.3, 3.2, 'ארבעה פרויקטים. ארבעה חלונות של Claude Code.'], [3.4, 6.3, 'באיזה מהם Claude מחכה לך?'],
  [6.6, 8.7, 'YDeck: כל הפרויקטים במסך אחד.'], [8.9, 11.4, 'Claude מחכה לך ב־Orbit, והנה למה.'], [11.6, 14.3, 'מה הוא עשה, ומה עוד לא נשמר.'],
  [14.5, 17.1, 'שרת שנשאר דולק, מפתח שחסר ב־env.'], [17.3, 21.0, 'לחיצה, ורואים מה בדיוק השתנה.'], [21.2, 25.4, 'ובסוף היום, סוגרים הכול בלחיצה.']];
function headline(t) {
  for (const [a, b, s] of HEADS) {
    const inn = out3(seg(t, a, a + .6)), gone = seg(t, b - .35, b), alpha = inn * (1 - gone);
    if (alpha <= 0) continue;
    const y = 150 + (1 - inn) * 26 - gone * 14, size = 66;
    g.font = `500 ${size}px Plex`; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const mark = s.slice(-1), body = s.slice(0, -1);
    const bw = g.measureText(body).width, mw = g.measureText(mark).width;
    const left = W / 2 - (bw + mw) / 2;
    g.globalAlpha = alpha;
    g.fillStyle = rgb(PAPER); g.textAlign = 'right'; g.fillText(body, left + mw + bw, y);
    g.fillStyle = rgb(AMBER);
    if (mark === '.') { g.beginPath(); g.arc(left + mw / 2, y - 8, size / 11, 0, Math.PI * 2); g.fill(); }
    else { g.textAlign = 'right'; g.fillText(mark, left + mw, y); }
    g.globalAlpha = 1;
  }
}

window.render = t => {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.textBaseline = 'alphabetic';
  g.fillStyle = rgb(NIGHT); g.fillRect(0, 0, W, H);
  terminals(t);
  windowLayer(t);
  // the night above the window, under the headline
  const band = g.createLinearGradient(0, 0, 0, 300);
  band.addColorStop(0, rgb(NIGHT, 1)); band.addColorStop(.55, rgb(NIGHT, .92)); band.addColorStop(1, rgb(NIGHT, 0));
  g.fillStyle = band; g.fillRect(0, 0, W, 300);
  endCard(t);
  headline(t);
};
window.ready = Promise.all([
  document.fonts.load('500 40px Plex'), document.fonts.load('400 40px Plex'),
  ...SCREENS.map(k => load(k, `app-${k}.png`)),
]).then(() => { window.render(0); return true; });
</script>
</body>
</html>
