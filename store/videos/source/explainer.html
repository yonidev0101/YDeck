<!doctype html>
<!--
  "YDeck in 24 seconds": the explainer to send people. 1080x1920, frame-exact (window.render(t)); render.cjs adds the sting.
  Shows the shipped "glass" widget (tinted with the project colour) on a phone.
   0.2  "כמה פרויקטים. / כמה חשבונות."        grey chips of accounts and consoles pile up around the screen
   2.85 "תכירו את YDeck. / ווידג׳ט לכל פרויקט."  they are pulled in; a phone rises with the glass widget
   5.6  "כל השירותים שלו / בלחיצה אחת."         the marks light up one by one
   9.4  "וכל אחד נפתח / בחשבון הנכון."          taps: Firebase opens as dana@nova.dev, Vercel in its Chrome channel
  13.35 "פרויקט אחר? / נגיעה בנקודות."          the page dots switch Nova → Orbit → Pulse; the glass takes each colour
  17.2  "בכל גודל. / גם בשורה אחת."             the widget folds to the one-row strip
  20.6  "כל הפרויקט. / במקום אחד."               the phone leaves; the mark; the mint tile opens into indigo for the sting
-->
<meta charset="utf-8">
<script src="../../play/source/icons.js"></script>
<style>
  @font-face { font-family: Plex; src: url("../../../app/src/main/res/font/plex_sans_hebrew_regular.ttf"); font-weight: 400; }
  @font-face { font-family: Plex; src: url("../../../app/src/main/res/font/plex_sans_hebrew_medium.ttf"); font-weight: 500; }
  @font-face { font-family: Plex; src: url("../../../app/src/main/res/font/plex_sans_hebrew_semibold.ttf"); font-weight: 600; }
  @font-face { font-family: Noto; src: url("../../../app/src/main/res/font/noto_sans_hebrew.ttf"); font-weight: 100 900; }
  @font-face { font-family: Mono; src: url("../../../app/src/main/res/font/plex_mono_medium.ttf"); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A0A0B; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; left: 0; top: 0; }
  .head { position: absolute; top: 250px; right: 96px; left: 96px; direction: rtl; font: 200 92px/1.12 Noto, sans-serif; letter-spacing: -0.02em; color: #F4F4F5; }
  .mask { overflow: hidden; padding-bottom: 10px; }
  .l2 { color: #5EF2C2; font-weight: 300; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="head" id="head"><div class="mask"><div id="l1"></div></div><div class="mask"><div class="l2" id="l2"></div></div></div>
<canvas id="grain" width="540" height="960" style="width:1080px;height:1920px;opacity:.045;mix-blend-mode:overlay"></canvas>
<script>
const $ = id => document.getElementById(id);
const x = $('c').getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, d) => clamp((t - a) / d);
const p3 = p => 1 - Math.pow(1 - p, 3);
const p3in = p => p * p * p;
const io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const backOut = p => { const s = 1.6; p -= 1; return p * p * ((s + 1) * p + s) + 1; };
const lerp = (a, b, k) => a + (b - a) * k;
const INDIGO = '#3D35E0', MINT = '#5EF2C2', NIGHT = '#0A0A0B', ON = '#F4F4F5';
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixRgb = (a, b, k) => a.map((v, i) => Math.round(lerp(v, b[i], k)));

// ---- headlines ----
// The developer's story comes first (0–6.6 s); everything after it runs on the film's earlier clock, OFF later.
const OFF = 4.0;
const LINES = [
  [0.2, 1.95, 'אתה מפתח.', 'יש לך פרויקטים.'],
  [2.15, 4.05, 'לכל פרויקט', 'מלא קישורים.'],
  [4.25, 6.35, 'ולכל אחד', 'חשבונות משלו.'],
  [6.85, 9.35, 'תכירו את YDeck.', 'ווידג׳ט לכל פרויקט.'],
  [9.6, 13.15, 'כל הקישורים שלו.', 'בלחיצה אחת.'],
  [13.4, 17.1, 'וכל אחד נפתח', 'בחשבון הנכון.'],
  [17.35, 20.95, 'פרויקט אחר?', 'נגיעה בנקודות.'],
  [21.2, 24.3, 'בכל גודל.', 'גם בשורה אחת.'],
  [24.6, 27.4, 'כל הפרויקט.', 'במקום אחד.'],
];
function headline(t) {
  const cur = LINES.find(([a, b]) => t >= a - 0.01 && t < b + 0.32);
  if (!cur) { $('l1').textContent = $('l2').textContent = ''; return; }
  const [a, b, one, two] = cur;
  $('l1').textContent = one; $('l2').textContent = two;
  const inn = at => (1 - p3(seg(t, at, 0.45))) * 120, out = -p3in(seg(t, b, 0.28)) * 120;
  $('l1').style.transform = `translateY(${t < b ? inn(a) : out}px)`;
  $('l2').style.transform = `translateY(${t < b ? inn(a + 0.14) : out}px)`;
}

// ---- drawing helpers ----
function rr(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, r); }
function text(s, px, py, font, color, align = 'center', dir = 'rtl') {
  x.font = font; x.fillStyle = color; x.textAlign = align; x.direction = dir; x.fillText(s, px, py);
}
const ICON = {};
for (const [k, v] of Object.entries(ICONS)) ICON[k] = { s: 1 / +v.vb[0], paths: v.paths.map(p => ({ p: new Path2D(p.d), stroke: p.stroke, sw: +p.sw })) };
function icon(name, color, size, cx, cy) {
  const i = ICON[name]; x.save(); x.translate(cx - size / 2, cy - size / 2); x.scale(size * i.s, size * i.s);
  i.paths.forEach(p => { if (p.stroke) { x.strokeStyle = color; x.lineWidth = p.sw; x.lineCap = 'round'; x.stroke(p.p); } else { x.fillStyle = color; x.fill(p.p); } });
  x.restore();
}
const YP = ['M296.4,364.4L113.1,181.3Q95.4,163.6 113.1,145.9L144.9,114.1Q162.6,96.4 180.3,114.1L363.6,297.4Z',
  'M262,513L262,330C262,310 276,295.8 290,281.8L457.7,114.1Q475.4,96.4 493.1,114.1L524.9,145.9Q542.6,163.6 524.9,181.3L376,330.2L376,513Q376,545 344,545L294,545Q262,545 262,513Z',
  'M262,455L376,341L376,513Q376,545 344,545L294,545Q262,545 262,513Z'].map(d => new Path2D(d));
const TILES = [[68, 312], [150, 312], [68, 394], [150, 394], [422, 312], [504, 312], [422, 394], [504, 394]];
function markAt(cx, cy, k, fg, hi) {
  x.save(); x.translate(cx, cy); x.scale(k, k); x.translate(-319, -320);
  TILES.forEach(([tx, ty], i) => { rr(tx, ty, 66, 66, 16); x.fillStyle = i === 5 && hi ? hi : fg; x.fill(); });
  x.fillStyle = fg; YP.forEach(p => x.fill(p));
  x.restore();
}

// ---- the phone and its wallpaper (pre-rendered, sharp and blurred for the glass) ----
const PX = 100, PW = 880, PH = 1600, PR = 110, BZ = 16, SW = PW - 2 * BZ, SH = PH - 2 * BZ;
function makeWall(blur) {
  const c = document.createElement('canvas'); c.width = SW; c.height = SH; const g = c.getContext('2d');
  g.fillStyle = '#D8D1C4'; g.fillRect(0, 0, SW, SH);
  g.filter = 'blur(110px)';
  g.fillStyle = '#E8A27A'; g.beginPath(); g.arc(SW * 0.85, 250, 330, 0, 7); g.fill();
  g.fillStyle = '#8EA4C8'; g.beginPath(); g.arc(SW * 0.1, 900, 360, 0, 7); g.fill();
  g.fillStyle = '#C9B8E8'; g.beginPath(); g.arc(SW * 0.7, 1350, 280, 0, 7); g.fill();
  if (blur) { const d = document.createElement('canvas'); d.width = SW; d.height = SH; const h = d.getContext('2d'); h.filter = 'blur(34px)'; h.drawImage(c, 0, 0); return d; }
  return c;
}
const WALL = makeWall(false), WALL_BLUR = makeWall(true);

// ---- the widget: "glass", exactly as DeckWidget.kt draws it (units = dp, scaled by S) ----
const S = 2.12, WW = 360, WFULL = 204, WSTRIP = 76;
const SLOTS = [['si_googleplay', 'Play', '#1D1D1F'], ['si_firebase', 'Firebase', '#DD2C00'], ['si_github', 'GitHub', '#181717'], ['si_vercel', 'Vercel', '#000000'],
  ['si_googleanalytics', 'Analytics', '#E37400'], ['si_supabase', 'Supabase', '#3FCF8E'], ['si_sentry', 'Sentry', '#362D59'], ['ic_s_dots', 'עוד', '#6E6E73']];
const PROJECTS = [['Nova', 'N', '#0B0B0C', 'dana@nova.dev'], ['Orbit', 'O', '#0EA5E9', 'hello@orbit.app'], ['Pulse', 'P', '#FF5A36', 'dana@pulse.io']];
const nearBlack = c => { const [r, g, b] = hex(c); return r + g + b < 60; };
// slot centres in widget units (RTL: first on the right)
const slotXY = i => [WW - 16 - 41 - (i % 4) * 82, 64 + Math.floor(i / 4) * 69 + 6 + 13];
const stripXY = i => [WW - 16 - 30 - 18 - 23 - i * 50, WSTRIP / 2];

function widgetContent(proj, a, st, t, wy) {
  if (a <= 0) return;
  const [name, mono, color, acct] = PROJECTS[proj];
  x.save(); x.globalAlpha *= a;
  const full = 1 - clamp(st * 2), strip = clamp(st * 2 - 1);
  if (full > 0) {
    x.save(); x.globalAlpha *= full;
    rr(WW - 16 - 30, 19, 30, 30, 9); x.fillStyle = color; x.fill();
    text(mono, WW - 31, 39.5, '600 15px Plex', '#FFFFFF', 'center', 'ltr');
    text(name, WW - 56, 31, '600 15px Plex', '#1D1D1F', 'right', 'ltr');
    text(acct, WW - 56, 47, '400 11px Plex', '#55555B', 'right', 'ltr');
    // page dots: the current project is a short bar in its colour
    let dx = 16 + 32;
    PROJECTS.forEach((_, i) => {
      const w = i === proj ? 14 : 5; dx -= w;
      rr(dx, 31.5, w, 5, 2.5); x.fillStyle = i === proj ? (nearBlack(color) ? '#1D1D1F' : color) : 'rgba(29,29,31,.22)'; x.fill();
      dx -= 4;
    });
    SLOTS.forEach(([n, l, c], i) => {
      const [sx, sy] = slotXY(i), bump = pulse(t, i);
      x.save(); x.translate(sx, sy); x.scale(1 + 0.18 * bump, 1 + 0.18 * bump);
      if (bump > 0) { x.beginPath(); x.arc(0, 0, 22, 0, 7); x.fillStyle = `rgba(61,53,224,${0.1 * bump})`; x.fill(); }
      icon(n, c, 26, 0, 0);
      x.restore();
      text(l, sx, sy + 13 + 7 + 11, '500 11.5px Plex', '#3C3C43', 'center', /[א-ת]/.test(l) ? 'rtl' : 'ltr');
    });
    x.restore();
  }
  if (strip > 0) {
    x.save(); x.globalAlpha *= strip;
    rr(WW - 16 - 34, WSTRIP / 2 - 17, 34, 34, 10); x.fillStyle = color; x.fill();
    text(mono, WW - 33, WSTRIP / 2 + 6, '600 16px Plex', '#FFFFFF', 'center', 'ltr');
    [0, 1, 2, 3, 4, 7].forEach((s, i) => { const [sx, sy] = stripXY(i); icon(SLOTS[s][0], SLOTS[s][2], 24, sx, sy); });
    x.restore();
  }
  x.restore();
}

// the card: real blur of the wallpaper behind it, white glass, a 14% wash of the project colour, a light edge
function widget(t, cx, top, alpha, scale, phoneY) {
  const st = io(seg(t, 17.8, 0.8));
  const h = lerp(WFULL, WSTRIP, st);
  // project switches: Nova → Orbit at 14.3, Orbit → Pulse at 15.4
  const k1 = io(seg(t, 14.35, 0.4)), k2 = io(seg(t, 15.45, 0.4));
  const tint = mixRgb(mixRgb([255, 255, 255], hex('#0EA5E9'), k1), hex('#FF5A36'), k2);
  const tintA = 0.14 * Math.max(k1, k2 > 0 ? 1 : 0);
  x.save(); x.globalAlpha = alpha;
  x.translate(cx, top); x.scale(scale, scale); x.translate(-WW * S / 2, 0); x.scale(S, S);
  // shadow
  x.save(); x.shadowColor = 'rgba(40,30,20,.22)'; x.shadowBlur = 40; x.shadowOffsetY = 16; rr(0, 0, WW, h, 30); x.fillStyle = '#C8C0B3'; x.fill(); x.restore();
  // glass: the blurred wallpaper, placed where it sits behind the card
  x.save(); rr(0, 0, WW, h, 30); x.clip();
  x.save(); x.scale(1 / S, 1 / S); x.scale(1 / scale, 1 / scale);
  x.drawImage(WALL_BLUR, -(cx - WW * S * scale / 2 - PX - BZ), -(top - phoneY - BZ));
  x.restore();
  x.fillStyle = 'rgba(255,255,255,.58)'; x.fillRect(0, 0, WW, h);
  if (tintA > 0) { x.fillStyle = `rgba(${tint.join(',')},${tintA})`; x.fillRect(0, 0, WW, h); }
  x.restore();
  rr(0.5, 0.5, WW - 1, h - 1, 29.5); x.lineWidth = 1.2; x.strokeStyle = 'rgba(255,255,255,.8)'; x.stroke();
  // content: cross-fade between projects
  const proj = k2 > 0 ? [[1, 1 - k2], [2, k2]] : [[0, 1 - k1], [1, k1]];
  proj.forEach(([p, a]) => widgetContent(p, a, st, t, top));
  x.restore();
  return h;
}
// the marks light up in turn (5.95 + i·0.2)
function pulse(t, i) { return Math.sin(Math.PI * seg(t, 5.95 + i * 0.2, 0.45)); }

// ---- finger and toasts ----
function finger(px, py, a, press = 0) {
  if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  x.beginPath(); x.arc(px, py, 44 * (1 - 0.14 * press), 0, 7);
  x.fillStyle = 'rgba(61,53,224,.16)'; x.fill(); x.lineWidth = 4; x.strokeStyle = 'rgba(61,53,224,.85)'; x.stroke();
  x.restore();
}
function toast(t, at, end, right, left, y) {
  const k = p3(seg(t, at, 0.4)) * (1 - seg(t, end, 0.3));
  if (k <= 0) return;
  x.save(); x.globalAlpha = k;
  const yy = y + (1 - k) * 24, w = 700;
  rr(540 - w / 2, yy, w, 92, 46); x.fillStyle = 'rgba(16,16,18,.88)'; x.fill();
  x.beginPath(); x.arc(540 + w / 2 - 48, yy + 46, 9, 0, 7); x.fillStyle = MINT; x.fill();
  text(right, 540 + w / 2 - 74, yy + 56, '500 29px Plex', ON, 'right', 'rtl');
  text(left, 540 - w / 2 + 42, yy + 56, '500 29px Mono', MINT, 'left', 'ltr');
  x.restore();
}

// ---- grain ----
const g = $('grain'), gx = g.getContext('2d'), gd = gx.createImageData(540, 960);
function grain(f) { let s = (f * 2654435761) >>> 0; for (let i = 0; i < gd.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const c = s >>> 24; gd.data[i] = gd.data[i + 1] = gd.data[i + 2] = c; gd.data[i + 3] = 255; } gx.putImageData(gd, 0, 0); }

// ---- the developer's story: three projects, each with its own pile of links and its own accounts ----
// [name, monogram, colour, links, accounts]; grey like all clutter, only the project squares carry colour
const STORY = [
  ['Nova', 'N', '#0B0B0C', ['firebase.google.com', 'play.google.com', 'vercel.com/nova', 'github.com/nova', 'sentry.io/nova'], ['dana@nova.dev', 'dana.cohen@gmail.com']],
  ['Orbit', 'O', '#0EA5E9', ['cloud.mongodb.com', 'railway.com/orbit', 'github.com/orbit', 'resend.com', 'stripe.com'], ['hello@orbit.app', 'team@agency.io']],
  ['Pulse', 'P', '#FF5A36', ['supabase.com', 'vercel.com/pulse', 'console.neon.tech', 'analytics.google', 'openai.com'], ['dana@pulse.io', 'dana.c.dev@gmail.com']],
];
const COLX = [870, 540, 210], COLW = 300;   // RTL: the first project on the right
function story(t) {
  if (t > 7.2) return;
  STORY.forEach(([name, mono, color, links, accts], c) => {
    const cx = COLX[c];
    // everything is pulled into the phone that rises (6.25–6.8)
    const pull = p3in(seg(t, 6.2 + c * 0.05, 0.55));
    const place = (px, py) => [lerp(px, 540, pull), lerp(py, 1250, pull)];
    x.save(); x.globalAlpha = 1 - pull;
    // the project card
    const ca = backOut(seg(t, 0.45 + c * 0.18, 0.45));
    if (ca > 0) {
      const [px, py] = place(cx, 750);
      x.save(); x.translate(px, py); x.scale(ca * (1 - 0.6 * pull), ca * (1 - 0.6 * pull));
      rr(-COLW / 2, -60, COLW, 120, 32); x.fillStyle = '#16161A'; x.fill(); x.lineWidth = 2; x.strokeStyle = '#2E2E33'; x.stroke();
      rr(COLW / 2 - 24 - 60, -30, 60, 60, 17); x.fillStyle = color; x.fill();
      if (color === '#0B0B0C') { x.lineWidth = 2; x.strokeStyle = '#3A3A3F'; x.stroke(); }
      text(mono, COLW / 2 - 54, 11, '600 30px Plex', '#FFFFFF', 'center', 'ltr');
      text(name, COLW / 2 - 102, 12, '500 36px Plex', ON, 'right', 'ltr');
      x.restore();
    }
    // its links pour out under it, one by one
    links.forEach((l, i) => {
      const a = p3(seg(t, 2.3 + c * 0.12 + i * 0.13, 0.35));
      if (a <= 0) return;
      const [px, py] = place(cx, 870 + i * 76 + (1 - a) * 24);
      x.save(); x.globalAlpha *= a; x.translate(px, py); x.scale(1 - 0.6 * pull, 1 - 0.6 * pull);
      rr(-COLW / 2, -29, COLW, 58, 29); x.fillStyle = '#1C1C1F'; x.fill(); x.lineWidth = 1.5; x.strokeStyle = '#2E2E33'; x.stroke();
      // a little link glyph
      x.beginPath(); x.arc(-COLW / 2 + 22, 0, 6, 0, 7); x.lineWidth = 2.5; x.strokeStyle = '#5C5C61'; x.stroke();
      text(l, -COLW / 2 + 38, 8, '500 22px Mono', '#A1A1A8', 'left', 'ltr');
      x.restore();
    });
    // and its own accounts
    accts.forEach((e, i) => {
      const a = backOut(seg(t, 4.45 + c * 0.15 + i * 0.22, 0.4));
      if (a <= 0) return;
      const [px, py] = place(cx, 1275 + i * 76);
      x.save(); x.translate(px, py); x.scale(a * (1 - 0.6 * pull), a * (1 - 0.6 * pull));
      rr(-COLW / 2, -30, COLW, 60, 30); x.fillStyle = '#26262A'; x.fill();
      x.beginPath(); x.arc(-COLW / 2 + 24, 0, 14, 0, 7); x.fillStyle = '#3A3A3F'; x.fill();
      text(e[0], -COLW / 2 + 24, 7, '600 18px Plex', '#D1D1D6', 'center', 'ltr');
      text(e, -COLW / 2 + 45, 7, '500 20px Mono', '#C7C7CC', 'left', 'ltr');
      x.restore();
    });
    x.restore();
  });
}

window.render = (t, f = Math.round(t * 30)) => {
  x.setTransform(1, 0, 0, 1, 0, 0); x.filter = 'none';
  x.fillStyle = NIGHT; x.fillRect(0, 0, 1080, 1920);
  headline(t);
  story(t);
  t -= OFF;   // the rest of the film keeps its own clock

  // the phone rises (2.95) and leaves (20.4)
  const py = lerp(lerp(1960, 520, p3(seg(t, 2.95, 0.85))), 1960, p3in(seg(t, 20.35, 0.7)));
  if (py < 1920) {
    x.save();
    rr(PX, py, PW, PH, PR); x.fillStyle = '#1A1A1D'; x.fill(); x.lineWidth = 3; x.strokeStyle = '#2E2E33'; x.stroke();
    rr(PX + BZ, py + BZ, SW, SH, PR - BZ); x.save(); x.clip(); x.drawImage(WALL, PX + BZ, py + BZ);
    // the widget lands on the home screen
    const wa = p3(seg(t, 3.55, 0.5)), ws = 0.92 + 0.08 * backOut(seg(t, 3.55, 0.55));
    const top = py + 150;
    let h = WFULL * S;
    if (wa > 0) h = widget(t, 540, top, wa, ws, py) * S;
    const bottom = top + h;
    // taps: Firebase (10.4), Vercel (11.95), the page dots (14.3, 15.4)
    const tap = (at, sx, sy) => finger(540 - WW * S / 2 + sx * S, top + sy * S + 14, seg(t, at - 0.35, 0.25) * (1 - seg(t, at + 0.35, 0.25)), Math.sin(Math.PI * seg(t, at, 0.22)));
    tap(10.4, ...slotXY(1)); tap(11.95, ...slotXY(3));
    tap(14.3, 16 + 16, 34); tap(15.4, 16 + 16, 34);
    toast(t, 10.6, 11.75, 'Firebase נפתח בחשבון', 'dana@nova.dev', bottom + 50);
    toast(t, 12.15, 13.2, 'Vercel נפתח בדפדפן', 'Chrome Beta', bottom + 50);
    x.restore(); x.restore();
  }

  // the close: the mark, then its mint tile opens into indigo for the sting
  const ma = p3(seg(t, 20.95, 0.5));
  if (ma > 0) {
    const k = 0.62 * (0.9 + 0.1 * backOut(seg(t, 20.95, 0.6)));
    x.save(); x.globalAlpha = ma; markAt(540, 1130, k, '#FFFFFF', MINT);
    text('YDeck', 540, 1400, '600 76px Plex', '#FFFFFF', 'center', 'ltr');
    text('בקרוב ב־Google Play', 540, 1490, '400 34px Plex', '#8A8A90', 'center', 'rtl');
    x.restore();
  }
  if (t >= 22.95) {
    const k = p3in(seg(t, 22.95, 0.9));
    const tx = 540 + (537 - 319) * 0.62, ty = 1130 + (345 - 320) * 0.62;
    if (k < 1) { x.beginPath(); x.arc(lerp(tx, 540, k), lerp(ty, 960, k), lerp(20, 1250, k), 0, 7); x.fillStyle = INDIGO; x.fill(); }
    else { x.fillStyle = INDIGO; x.fillRect(0, 0, 1080, 1920); }
  }
  grain(f);
};
window.DURATION = 28.0;
// fonts used only inside the canvas must be loaded explicitly
window.ready = Promise.all(['400 40px Plex', '500 40px Plex', '600 40px Plex', '500 36px Mono', '200 100px Noto', '300 100px Noto'].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready).then(() => window.render(0));
</script>
