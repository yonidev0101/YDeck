<!doctype html>
<!--
  Google Play phone screenshots, 1080x1920 (?n=1..8). The site's light language: a soft wallpaper, a thin two-line
  headline (second line indigo), and the real app screen (screens/*.png, captured on the emulator with the demo
  projects Nova, Orbit and Pulse) in a plain phone frame that runs off the bottom edge.
  Rendered by shoot-screens.cjs into ../screenshots/.
-->
<meta charset="utf-8">
<style>
  @font-face { font-family: Plex; src: url("../../../app/src/main/res/font/plex_sans_hebrew_regular.ttf"); font-weight: 400; }
  @font-face { font-family: Plex; src: url("../../../app/src/main/res/font/plex_sans_hebrew_medium.ttf"); font-weight: 500; }
  @font-face { font-family: Noto; src: url("../../../app/src/main/res/font/noto_sans_hebrew.ttf"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; direction: rtl; -webkit-font-smoothing: antialiased; }
  body { background: radial-gradient(70% 45% at 92% 6%, #D6D1FF 0, transparent 70%), radial-gradient(60% 40% at 0% 100%, #FFDCCD 0, transparent 70%),
    radial-gradient(50% 30% at 50% 60%, #DDF7EE 0, transparent 70%), #F4F3FA; font-family: Plex, sans-serif; color: #0B0B0C; }
  .copy { position: absolute; top: 118px; right: 96px; left: 96px; }
  h1 { font: 200 92px/1.08 Noto, sans-serif; letter-spacing: -2px; }
  h1 b { font-weight: 300; color: #3D35E0; }
  p { margin-top: 26px; font-size: 34px; line-height: 1.45; color: #5C5C61; max-width: 820px; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .phone { position: absolute; left: 50%; transform: translateX(-50%); top: 560px; width: 760px; height: 1604px; border-radius: 96px;
    background: #0B0B0C; padding: 22px; box-shadow: 0 60px 120px -40px rgba(30, 20, 110, .45); }
  .phone img { display: block; width: 716px; height: 1512px; border-radius: 76px; object-fit: cover; object-position: top; }
  .top .phone { top: 600px; }
</style>
<div class="copy"><h1 id="h"></h1><p id="p"></p></div>
<div class="phone"><img id="img" alt=""></div>
<script>
const S = {
  1: ['home', 'כל הפרויקט.<br><b>במקום אחד.</b>', 'ווידג׳ט לכל פרויקט על מסך הבית, וכל נגיעה נפתחת בחשבון הנכון.'],
  2: ['home2', 'כל פרויקט<br><b>בגוון שלו.</b>', 'כמה ווידג׳טים, ולכל אחד פרויקט, צבע וחשבון משלו.'],
  3: ['home-strip', 'מ־<span class="ltr">4×2</span><br><b>ועד שורה אחת.</b>', 'משנים גודל, והווידג׳ט מסתדר לבד.'],
  4: ['more2', 'כל הקישורים.<br><b>וכל מה שמעתיקים.</b>', 'נגיעה ב״עוד״: כל הקישורים של הפרויקט, ו־package, repo ומזהים בהעתקה אחת.'],
  5: ['detect', 'מדביקים קישור.<br><b>השירות מזוהה לבד.</b>', '161 שירותים עם הלוגו האמיתי, ולכל קישור אחר האייקון של האתר.'],
  6: ['editor', 'רואים את הווידג׳ט<br><b>תוך כדי עריכה.</b>', 'שם, צבע, לוגו, חשבון וקישורים. הכול בטלפון.'],
  7: ['list', 'הפרויקטים שלך<br><b>נשארים אצלך.</b>', 'בלי שרת ובלי חשבון. גיבוי לקובץ, ולטלפון חדש דרך הגיבוי של אנדרואיד.'],
  8: ['welcome', 'מתחילים<br><b>בדקה.</b>', 'פרויקט חדש, או פרויקט לדוגמה כדי לראות איך זה עובד.'],
};
const n = new URLSearchParams(location.search).get('n') || '1';
const [img, h, p] = S[n];
document.getElementById('h').innerHTML = h;
document.getElementById('p').innerHTML = p;
const el = document.getElementById('img');
el.src = 'screens/' + img + '.png';
window.ready = Promise.all([document.fonts.ready, new Promise(r => { el.onload = r; el.onerror = r; })]);
</script>
