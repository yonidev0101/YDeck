# Builds the Windows installer on a clean GitHub machine, from the commit in the repository.
#   - By hand (Actions → Windows → Run workflow): builds and tests, and keeps the MSI as the run's artifact.
#   - On a tag (git tag v1.15.3 && git push --tags): the same, then publishes the MSI on the tag's release.
#     The tag must match desktopVersion in desktop/build.gradle.kts.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: The version
        id: version
        shell: bash
        run: |
          v=$(sed -n 's/^val desktopVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match desktopVersion $v"; exit 1
          fi

      - name: Test
        shell: bash
        run: ./gradlew :desktop:test --no-daemon

      - name: Build the installer
        shell: bash
        run: ./gradlew :desktop:distribute --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: YDeck-Windows-${{ steps.version.outputs.version }}
          path: dist/YDeck-Windows-${{ steps.version.outputs.version }}.msi

      - name: Publish on the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi="dist/YDeck-Windows-${{ steps.version.outputs.version }}.msi"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$msi" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$msi" --title "YDeck for Windows ${{ steps.version.outputs.version }}" --generate-notes
          fi
